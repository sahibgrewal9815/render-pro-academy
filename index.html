<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Render Pro Academy</title>
<meta name="description" content="Learn architectural rendering with SketchUp, D5 Render and Filmora. Online course, ready-to-use models and materials, and short Detail Lab videos.">
<meta name="theme-color" content="#0C0A09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RPA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Layout concept: a dark render viewport. Full-bleed imagery in a rounded frame, floating glass pills, quiet grotesk type, one orange accent. */
:root{
  --bg:#0C0A09; --surface:#151210; --surface-2:#1E1916; --line:#2E2723; --line-soft:#211C19;
  --fg:#F4EDE7; --muted:#A99C93; --accent:#F23F0A; --accent-ink:#FF6B3D; --on-accent:#FFF7F2;
  --ok:#43B581; --warn:#E5A93A; --bad:#EF5350; --info:#6AA6E8;
  --c-course:#F23F0A; --c-store:#E5A93A; --c-lab:#6AA6E8; --c-review:#9C8CF0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  --f-display:"Inter Tight","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px; --maxw:1200px;
  --glass-bg:rgba(14,11,10,.62); --glass-line:rgba(255,255,255,.08); --glass-fg:#F4EDE7; --glass-muted:rgba(244,237,231,.72); --glass-hover:rgba(255,255,255,.05); --glass-on:rgba(255,255,255,.1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F0EC; --surface:#FFFFFF; --surface-2:#ECE5DF; --line:#DCD2CA; --line-soft:#E8E0D9;
  --fg:#17110E; --muted:#6E625B; --accent:#E03A08; --accent-ink:#C23006; --on-accent:#FFFFFF;
  --ok:#1E8B5A; --warn:#A86F0C; --bad:#C62F2C; --info:#2C6DB5;
  --c-course:#E03A08; --c-store:#C7860F; --c-lab:#3E7FC4; --c-review:#6E5BD6;
  --shadow:0 18px 40px -22px rgba(60,30,10,.3);
  --glass-bg:rgba(255,255,255,.72); --glass-line:rgba(23,17,14,.08); --glass-fg:#17110E; --glass-muted:rgba(23,17,14,.66); --glass-hover:rgba(23,17,14,.04); --glass-on:rgba(23,17,14,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,5.6vw,4.4rem);font-weight:600}
h2{font-size:clamp(1.6rem,3.2vw,2.4rem);font-weight:600}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.section{padding-block:clamp(48px,7vw,88px)}
.section + .section{border-top:1px solid var(--line-soft)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}
.sec-head > div{display:grid;gap:10px;max-width:640px}
.lede{color:var(--muted);font-size:1.02rem;max-width:62ch}

/* demo bar + header */
.demobar{background:var(--surface-2);border-bottom:1px solid var(--line-soft);font-size:.78rem;color:var(--muted)}
.demobar .wrap{display:flex;gap:10px;align-items:center;padding-block:7px;flex-wrap:wrap}
.demobar b{color:var(--fg);font-weight:600}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.hdr .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand svg{width:48px;height:auto;display:block}
.brand span{font-family:var(--f-display);font-weight:600;font-size:.9rem;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-mono);font-size:.6rem;color:var(--muted);letter-spacing:.16em;font-weight:400;margin-top:3px}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav a{text-decoration:none;padding:8px 11px;border-radius:var(--r-sm);color:var(--muted);font-size:.9rem;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--surface)}
.nav a.on{color:var(--fg);background:var(--surface-2)}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.cart-btn{position:relative}
.cart-btn .count{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--on-accent);font:600 .68rem/18px var(--f-mono);min-width:18px;height:18px;border-radius:9px;text-align:center;padding:0 4px}
@media (max-width:900px){
  .hdr .wrap{flex-wrap:wrap;row-gap:6px}
  .nav{order:3;flex-basis:100%;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
  .nav::-webkit-scrollbar{display:none}
  .hdr-actions{margin-left:auto}
  .hide-sm{display:none}
}

/* buttons, chips, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface);border-color:var(--line-soft)}
.btn-sm{padding:6px 10px;font-size:.8rem}
.btn-lg{padding:14px 22px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-danger{color:var(--bad)}
.icon{width:18px;height:18px;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.82rem;cursor:pointer}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.75rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:.92rem;min-width:0}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.spacer{flex:1}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line-soft)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:48px 48px;opacity:.55;mask-image:linear-gradient(180deg,#000 40%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(36px,6vw,72px)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero-copy{display:grid;gap:20px;min-width:0}
.hero h1 em{font-style:normal;color:var(--accent-ink)}
.titleblock{display:grid;grid-template-columns:repeat(3,auto);width:max-content;max-width:100%;border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.titleblock div{padding:6px 10px;border-right:1px solid var(--line);display:grid;gap:2px}
.titleblock div:last-child{border-right:0}
.titleblock span{color:var(--muted);font-size:.58rem}
@media (max-width:420px){.titleblock{grid-template-columns:1fr 1fr}.titleblock div:last-child{grid-column:1/-1;border-top:1px solid var(--line)}.titleblock div:nth-child(2){border-right:0}}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;padding-top:6px}
.hero-stats div{display:grid}
.hero-stats b{font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.hero-stats span{font-size:.78rem;color:var(--muted)}

/* scenes + before/after */
.scene{display:block;width:100%;height:100%}
.ba{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);user-select:none;background:var(--surface)}
.ba-layer{position:absolute;inset:0}
.ba-before .scene{filter:grayscale(1) contrast(.72) brightness(1.18)}
.ba-before::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(40,40,40,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(40,40,40,.08) 1px,transparent 1px);background-size:20px 20px}
.ba-after{clip-path:inset(0 0 0 var(--pos,50%))}
.ba-handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:var(--on-accent);transform:translateX(-1px);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.ba-handle::after{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:var(--on-accent);font-size:.6rem;letter-spacing:2px;padding:9px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba-label{position:absolute;bottom:12px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:rgba(15,12,10,.72);color:#F4EDE7;pointer-events:none}
.ba-label.l{left:12px}.ba-label.r{right:12px}
.ba-caption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--muted)}

/* pipeline */
.pipeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pipeline > div{padding:22px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line);position:relative}
.pipeline > div:last-child{border-right:0}
.pipeline .step{font-family:var(--f-mono);font-size:.7rem;color:var(--accent-ink);letter-spacing:.1em}
.pipeline h3{font-size:1.35rem}
@media (max-width:760px){.pipeline{grid-template-columns:1fr}.pipeline > div{border-right:0;border-bottom:1px solid var(--line)}.pipeline > div:last-child{border-bottom:0}}

/* offer grid */
.offers{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
@media (max-width:900px){.offers{grid-template-columns:1fr}}
.offer{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);text-decoration:none;transition:border-color .2s,transform .2s}
.offer:hover{border-color:var(--muted);transform:translateY(-2px)}
.offer .media{aspect-ratio:16/9;max-width:100%;overflow:hidden;position:relative}
.offer .body{padding:18px;display:grid;gap:8px;align-content:start}
.offer .from{font-family:var(--f-mono);font-size:.78rem;color:var(--accent-ink)}

/* cards & grids */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.g-wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .thumb{aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;background:var(--surface-2)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .badge{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(15,12,10,.75);color:#F4EDE7;padding:4px 7px;border-radius:4px}
.card .thumb .dur{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:.7rem;background:rgba(15,12,10,.75);color:#F4EDE7;padding:3px 6px;border-radius:4px}
.card .cbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .cbody h3{font-size:1rem;}
.card .spec{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.card .cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-family:var(--f-display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.price s{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px}
.swatch{position:absolute;inset:0}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.25)}
.card:hover .thumb .play{opacity:1}
.play-dot{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.tiers{grid-template-columns:1fr}}
.tier{border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;gap:16px;align-content:start;background:var(--surface);position:relative}
.tier.feat{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tier .ribbon{position:absolute;top:-11px;left:22px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:4px}
.tier .big{font-family:var(--f-display);font-weight:600;font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.92rem}
.ticks li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.ticks li::before{content:"";width:12px;height:7px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg);margin-top:5px}
.ticks li.no{color:var(--muted)}
.ticks li.no::before{border:0;height:2px;width:10px;background:var(--muted);transform:none;margin-top:10px}

/* syllabus */
.syl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.syl details{border-bottom:1px solid var(--line)}
.syl details:last-child{border-bottom:0}
.syl summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 18px;background:var(--surface)}
.syl summary::-webkit-details-marker{display:none}
.syl summary .code{font-family:var(--f-mono);font-size:.72rem;color:var(--accent-ink);border:1px solid var(--line);padding:3px 6px;border-radius:4px}
.syl summary h3{font-size:1.02rem}
.syl ol{margin:0;padding:6px 18px 14px 18px;list-style:none;display:grid}
.syl li{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:9px 0;border-top:1px dashed var(--line-soft);font-size:.92rem}
.syl li:first-child{border-top:0}

/* testimonials */
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.quotes{grid-template-columns:1fr}}
.quote{border-top:2px solid var(--accent);padding-top:16px;display:grid;gap:12px;align-content:start}
.quote p{font-size:1.02rem}
.stars{color:var(--warn);letter-spacing:2px;font-size:.85rem}

/* band */
.band{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:clamp(20px,4vw,36px)}
@media (max-width:760px){.band{grid-template-columns:1fr}}

/* gallery */
.gallery{columns:3 260px;column-gap:16px}
.gitem{break-inside:avoid;margin-bottom:16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-soft);background:var(--surface)}
.gitem .gimg{position:relative}
.gitem .gimg.tall{aspect-ratio:4/5}.gitem .gimg.wide{aspect-ratio:16/10}.gitem .gimg.sq{aspect-ratio:1}
.gitem .gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gitem .gcap{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:.85rem}

/* footer */
.ftr{border-top:1px solid var(--line-soft);margin-top:24px}
.ftr .wrap{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:24px;padding-block:40px}
.ftr h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.9rem}
.ftr a{text-decoration:none;color:var(--fg)}
.ftr a:hover{color:var(--accent-ink)}
.ftr button.linklike{background:none;border:0;padding:0;cursor:pointer;color:var(--fg);font-size:.9rem;text-align:left}
.ftr button.linklike:hover{color:var(--accent-ink)}
@media (max-width:760px){.ftr .wrap{grid-template-columns:1fr 1fr}.ftr .wrap > div:first-child{grid-column:1/-1}}

/* modal, drawer, toast */
.scrim{position:fixed;inset:0;background:rgba(8,6,5,.6);z-index:80;display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{flex:1;font-size:1.1rem}
.modal-body{padding:20px;display:grid;gap:16px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.drawer-scrim{place-items:stretch end;padding:0}
.drawer{background:var(--surface);border-left:1px solid var(--line);width:min(420px,100vw);height:100%;display:flex;flex-direction:column;animation:slide .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .modal-body{flex:1;overflow:auto;align-content:start}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.toasts{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);animation:fade .2s}
.toast b{font-family:var(--f-mono)}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.line-item .mini{width:56px;height:42px;border-radius:4px;overflow:hidden;position:relative;background:var(--surface-2)}
.line-item .mini img{width:100%;height:100%;object-fit:cover}
.totals{display:grid;gap:6px;font-size:.92rem}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--f-display);font-weight:600;font-size:1.25rem;padding-top:8px;border-top:1px solid var(--line)}
.cred{border:1px dashed var(--accent-ink);border-radius:var(--r-sm);padding:14px;display:grid;gap:6px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.cred .mono{font-size:.9rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

/* auth */
.auth{max-width:440px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:28px;display:grid;gap:18px}
.demo-note{font-size:.8rem;color:var(--muted);border-left:2px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 7%,transparent);border-radius:0 4px 4px 0}
.demo-note code{font-family:var(--f-mono);color:var(--fg)}
.alert{border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:var(--r-sm);padding:12px 14px;font-size:.88rem;display:grid;gap:4px}
.alert b{color:var(--bad)}

/* portal */
.portal{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start;padding-block:28px}
@media (max-width:900px){.portal{grid-template-columns:1fr}}
.side{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto}
@media (max-width:900px){.side{position:static;max-height:420px}}
.side .mod{padding:12px 14px 4px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.lesson-btn{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 14px;cursor:pointer;font-size:.86rem;color:var(--fg)}
.lesson-btn:hover{background:var(--surface-2)}
.lesson-btn.on{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 2px 0 0 var(--accent)}
.lesson-btn.locked{color:var(--muted)}
.lesson-btn .st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.6rem}
.lesson-btn .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:3px}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line)}
.player .scene{opacity:.85}
.player .ctrl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-family:var(--f-mono);font-size:.72rem}
.player .bar{flex:1;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.player .bar span{display:block;height:100%;background:#F23F0A;width:0}
.player .bigplay{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:#F23F0A;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.player .wm{position:absolute;font-family:var(--f-mono);font-size:.72rem;color:rgba(255,255,255,.38);pointer-events:none;transition:top 1.2s,left 1.2s;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.player .lockveil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,7,.82);color:#F4EDE7;text-align:center;padding:20px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap}
.ptabs button.on{color:var(--fg);border-color:var(--accent)}

/* certificate */
.cert{aspect-ratio:1.414;max-width:100%;background:#FBF8F4;color:#1B1411;border-radius:6px;padding:clamp(16px,4vw,40px);position:relative;display:grid;align-content:space-between;border:1px solid var(--line);overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid #D8CCC3;border-radius:3px;pointer-events:none}
.cert::after{content:"";position:absolute;inset:16px;border:2px solid #1B1411;border-radius:2px;pointer-events:none}
.cert .ch{display:flex;justify-content:space-between;align-items:start;gap:12px;position:relative}
.cert .ch svg{width:clamp(56px,10vw,96px);height:auto}
.cert .cm{text-align:center;display:grid;gap:clamp(4px,1vw,10px);position:relative}
.cert .cm .t{font-family:var(--f-mono);font-size:clamp(.5rem,1.2vw,.72rem);letter-spacing:.3em;text-transform:uppercase;color:#6F6158}
.cert .cm .n{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,4.4vw,2.8rem);line-height:1}
.cert .cm .c{font-size:clamp(.66rem,1.6vw,.95rem)}
.cert .cf{display:flex;justify-content:space-between;align-items:end;gap:12px;font-family:var(--f-mono);font-size:clamp(.48rem,1.1vw,.66rem);color:#6F6158;position:relative}
.cert .sig{border-top:1px solid #1B1411;padding-top:4px;min-width:30%;text-align:center;color:#1B1411}
.cert.locked{filter:grayscale(1);opacity:.45}

/* dashboard */
.dash{padding-block:24px 48px;display:grid;gap:20px}
.dash-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.dash-head h1{font-size:clamp(1.5rem,3vw,2rem)}
.dtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);width:max-content;max-width:100%}
.dtabs button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.86rem;white-space:nowrap;display:flex;gap:6px;align-items:center}
.dtabs button.on{background:var(--surface-2);color:var(--fg)}
.dtabs .n{font-family:var(--f-mono);font-size:.68rem;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:0 6px;line-height:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:4px}
.kpi .k{font-size:.78rem;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:.76rem}
.kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--bad)}
.panel{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);overflow:hidden;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.panel-head h3{font-size:1rem;flex:1;min-width:140px}
.panel-body{padding:16px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.wrapcell{white-space:normal;min-width:180px}
table.t .r{text-align:right}
table.t tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.who{display:grid;gap:1px}
.who small{color:var(--muted);font-size:.76rem}
.acts{display:flex;gap:4px;justify-content:flex-end}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid line{stroke:var(--line-soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.split span{display:block;height:100%}
.split-rows{display:grid;gap:10px;margin-top:14px;font-size:.86rem}
.split-rows div{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center}
.split-rows i{width:10px;height:10px;border-radius:2px}
.cover-up{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.cover-up .prev{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface-2);position:relative;border:1px solid var(--line)}
.cover-up .prev img{width:100%;height:100%;object-fit:cover}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:11px;transition:.2s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{left:19px}
.upload{border:1px dashed var(--line);border-radius:var(--r-sm);padding:16px;text-align:center;color:var(--muted);font-size:.86rem;cursor:pointer;display:block}
.upload:hover{border-color:var(--accent-ink);color:var(--fg)}
.upload input{display:none}
.faq{display:grid;gap:0;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--accent-ink)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:8px;color:var(--muted);max-width:70ch}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== framed hero ===== */
.buy{position:relative;overflow:hidden;display:flex;margin:12px;margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px));border-radius:28px;min-height:calc(100svh - 24px);background:#141110;isolation:isolate;
  --fg:#F4EDE7;--bg:#0C0A09;--muted:rgba(244,237,231,.66);--line:rgba(255,255,255,.16);color:var(--fg)}
.buy::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 120px rgba(0,0,0,.55);pointer-events:none}
.bg{position:absolute;inset:0;z-index:-2}
.bg-layer{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.bg-layer.on{opacity:1}
.bg-layer > img,.bg-layer > svg{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.07);transition:transform 9s ease-out;filter:saturate(1.05)}
.bg-layer.on > img,.bg-layer.on > svg{transform:scale(1)}
.bg .isogrid line{stroke:rgba(244,237,231,.08);stroke-width:.6}
.bg .edge{fill:none;stroke:rgba(0,0,0,.22);stroke-width:.6}
.bg-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(0deg,rgba(8,6,5,.92) 0%,rgba(8,6,5,.55) 30%,rgba(8,6,5,0) 58%),linear-gradient(180deg,rgba(8,6,5,.55) 0%,rgba(8,6,5,0) 22%)}
.hero-in{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:22px;padding:96px clamp(20px,5.5vw,96px) clamp(22px,3.4vw,40px)}
.hero-upper{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero-desc{display:grid;gap:8px;max-width:44ch}
.hero-desc .mono{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#FF7A4D}
.hero-desc p{font-size:clamp(.98rem,1.25vw,1.12rem);line-height:1.6;color:var(--muted)}
.hero-desc p b{color:var(--fg);font-weight:500}
.stage-dots{display:flex;gap:8px;margin-top:4px}
.stage-dots button{width:30px;height:3px;padding:0;border:0;border-radius:2px;background:rgba(244,237,231,.28);cursor:pointer;transition:background .3s,opacity .3s}
.stage-dots button.on{background:#F4EDE7}
.buy[data-plan="adv"] .stage-dots button.basic{opacity:.25}
.hero-price{display:grid;justify-items:end;gap:2px;text-align:right}
.hero-price > span{font-family:var(--f-display);font-weight:500;font-size:1.5rem;letter-spacing:-.01em}
.hero-price s{font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.hero-price small{font-size:.8rem;color:var(--muted)}
.hero-rule{height:1px;background:rgba(255,255,255,.16)}
.hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.wordmark{font-family:var(--f-display);font-weight:500;font-size:clamp(2.2rem,5.6vw,5rem);letter-spacing:-.035em;line-height:.95;margin:0}
.wordmark .wm-dot{color:#F23F0A}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plan-switch{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:999px;background:rgba(20,16,14,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.plan-switch button{border:0;background:none;border-radius:999px;padding:10px 16px;cursor:pointer;color:rgba(244,237,231,.7);font-size:.9rem;font-weight:500;white-space:nowrap;transition:background .25s,color .25s}
.plan-switch button:hover{color:#fff}
.plan-switch button[aria-checked="true"]{background:rgba(255,255,255,.14);color:#fff}
@media (max-width:760px){
  .buy{border-radius:22px;margin:8px;min-height:calc(100svh - 16px)}
  .hero-in{padding:84px 18px 18px;gap:16px}
  .hero-price{justify-items:start;text-align:left}
  .hero-actions{width:100%}
  .plan-switch{width:100%}
  .plan-switch button{padding:10px 8px;font-size:.86rem}
  #hero-buy{width:100%}
}
@media (prefers-reduced-motion:reduce){.bg-layer > img,.bg-layer > svg{transform:none}}

/* extras */
.price.free{font-family:var(--f-body);font-size:.86rem;font-weight:700;color:var(--ok)}
.perk-band{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--surface));padding:16px 20px}
.perks{display:flex;gap:12px}
.perk{display:grid;justify-items:center;gap:4px;font-size:.68rem;color:var(--muted);cursor:pointer}
.switch.sm{width:30px;height:18px}
.switch.sm span::after{width:12px;height:12px;top:3px;left:3px}
.switch.sm input:checked + span::after{left:15px}
.perkset{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:0;display:grid;gap:8px}
.perkset legend{font-size:.8rem;font-weight:600;color:var(--muted);padding:0 6px}

/* ===== glass pills, header, buttons (v3) ===== */
body{background:var(--bg)}
#view{padding-top:78px}
body[data-route="home"] #view{padding-top:0}
.demobar{display:none}
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
.hdr-in{display:flex;align-items:center;gap:10px;max-width:1440px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.hdr-in > *{pointer-events:auto}
.gpill{display:flex;align-items:center;gap:2px;height:46px;padding:4px;border-radius:14px;background:var(--glass-bg);border:1px solid var(--glass-line);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.brand-pill{padding:4px 14px 4px 10px;gap:10px;text-decoration:none;color:var(--glass-fg)}
.brand-pill svg{width:40px;height:auto}
.brand-pill span{font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap}
.nav{flex:0 1 auto;min-width:0;overflow:visible}
.nav a{padding:0 14px;height:100%;display:flex;align-items:center;border-radius:10px;color:var(--glass-muted);font-size:.92rem;font-weight:500;text-decoration:none;white-space:nowrap;background:none}
.nav a:hover{color:var(--glass-fg);background:var(--glass-hover)}
.nav a.on{color:var(--glass-fg);background:var(--glass-on)}
.icons-pill .ico{height:100%;min-width:38px;padding:0 10px;display:grid;place-items:center;border-radius:10px;border:0;background:none;color:var(--glass-muted);cursor:pointer;text-decoration:none;font-size:.86rem;font-weight:500;position:relative;white-space:nowrap}
.icons-pill .ico:hover,.icons-pill .ico.on{background:var(--glass-on);color:var(--glass-fg)}
.icons-pill .count{position:absolute;top:2px;right:2px;background:#F23F0A;color:#fff;font:600 .62rem/16px var(--f-mono);min-width:16px;height:16px;border-radius:8px;text-align:center;padding:0 3px}
.menu-btn{display:none!important}
.cta-pill{height:46px;padding:0 6px 0 18px!important;font-size:.92rem}
.btn{border-radius:999px}
.btn-primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn-primary:hover{background:var(--fg);border-color:var(--fg);opacity:.9}
.btn .arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-size:1rem;margin-right:-8px;transition:transform .25s,background .25s}
.btn:hover .arr{transform:translateX(2px);background:#F23F0A;color:#fff}
#hero-buy{height:50px;padding:0 8px 0 22px;gap:14px}
#hero-buy .arr{background:#F23F0A;color:#fff}
.btn-primary.btn-lg:not(#hero-buy):not(:has(.arr))::after{content:"→";width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--fg);margin-right:-10px;margin-left:4px}
.btn-glass{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);color:#F4EDE7;backdrop-filter:blur(12px)}
.input,select.input,textarea.input{border-radius:12px}
.card,.panel,.tier,.auth,.band,.syl,.pipeline,.kpi,.offer{border-radius:var(--r)}
.chip{border-radius:999px}
.menu-list{display:grid}
.menu-list a{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line-soft);text-decoration:none;font-size:1.05rem;font-weight:500}
.menu-list a.on{color:var(--accent-ink)}
.menu-list span{color:var(--muted)}
@media (max-width:1180px){.brand-pill span{display:none}.brand-pill{padding:4px 10px}}
@media (max-width:1020px){
  .nav{display:none}
  .menu-btn{display:grid!important}
  .icons-pill .ico.txt{display:none}
}
@media (max-width:760px){
  .hdr{padding-top:calc(env(safe-area-inset-top,0px) + 16px)}

function heroCycle(){ // card parallax on the home screen (particles run site-wide)

  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

    const light=document.documentElement.dataset.theme==='light';const ink=light?'23,17,14':'244,237,231';const lk=light?.12:.15;
    ctx.clearRect(0,0,W,H);
    if(!reduce)for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-mouse.x,dy=p.y-mouse.y,d2=dx*dx+dy*dy;if(d2<10000&&d2>0){const d=Math.sqrt(d2);const f=(100-d)/100*1.2;p.x+=dx/d*f;p.y+=dy/d*f}}
    ctx.lineWidth=.6;
    for(let i=0;i<pts.length;i++){const a=pts[i];
      for(let j=i+1;j<pts.length;j++){const b=pts[j];const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<L2){ctx.strokeStyle=`rgba(${ink},${((1-d2/L2)*lk).toFixed(3)})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
      const mx=a.x-mouse.x,my=a.y-mouse.y,md=mx*mx+my*my;
      if(md<M2){ctx.strokeStyle=`rgba(242,63,10,${((1-md/M2)*.7).toFixed(3)})`;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();ctx.lineWidth=.6}
      ctx.fillStyle=md<M2?`rgba(242,90,40,${Math.min(1,a.o+.3)})`:`rgba(${ink},${(light?a.o*.6:a.o).toFixed(2)})`;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.2832);ctx.fill();
    }
    if(mouse.x>-999){const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,240);g.addColorStop(0,`rgba(242,63,10,${light?.07:.12})`);g.addColorStop(1,'rgba(242,63,10,0)');ctx.fillStyle=g;ctx.fillRect(mouse.x-240,mouse.y-240,480,480)}
  }
  const loop=()=>{draw();raf=requestAnimationFrame(loop)};
  addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(reduce)draw()},{passive:true});
  document.documentElement.addEventListener('pointerleave',()=>{mouse.x=mouse.y=-9999});
  addEventListener('blur',()=>{mouse.x=mouse.y=-9999});
  addEventListener('resize',size);
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden&&!reduce)raf=requestAnimationFrame(loop)});
  size();if(!reduce)loop();else draw();
})();

const MONTHS=(()=>{const n=new Date();return Array.from({length:6},(_,i)=>{const d=new Date(n.getFullYear(),n.getMonth()-5+i,1);return{y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleString('en-IN',{month:'short'})}})})();
const STREAMS=[['course','Course'],['store','Models & materials'],['lab','Detail Lab'],['review','Render Review']];
function orderStreamSplit(o){const out={};o.items.forEach(i=>{const st=i.stream||o.stream;out[st]=(out[st]||0)+i.price});const sum=Object.values(out).reduce((a,b)=>a+b,0)||1;Object.keys(out).forEach(k=>out[k]=out[k]/sum*o.total);return out}
function aOverview(){
  const byM=MONTHS.map(()=>({course:0,store:0,lab:0,review:0}));
  DB.orders.forEach(o=>{const d=new Date(o.date);const mi=MONTHS.findIndex(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(mi<0)return;const sp=orderStreamSplit(o);Object.entries(sp).forEach(([k,v])=>byM[mi][k]=(byM[mi][k]||0)+v)});
  const tot=byM.map(m=>Object.values(m).reduce((a,b)=>a+b,0));
  const thisM=tot[5],lastM=tot[4];
  const inM=k=>DB.orders.filter(o=>{const d=new Date(o.date);return d.getFullYear()===MONTHS[k].y&&d.getMonth()===MONTHS[k].m});const oct=inM(4),nov=inM(5);

  const expSoon=DB.students.filter(s=>s.expires!=='lifetime'&&!isExpired(s)&&(new Date(s.expires)-new Date())<30*864e5);
  const allStream={course:0,store:0,lab:0,review:0};byM.forEach(m=>Object.keys(allStream).forEach(k=>allStream[k]+=m[k]||0));const all=Object.values(allStream).reduce((a,b)=>a+b,0)||1;
  // chart
  const W=600,H=230,pl=44,pb=24,pt=12,max=Math.max(10000,...tot)*1.12,step=max>150000?50000:max>60000?20000:10000,ymax=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/ymax),bw=(W-pl-10)/6*.56;
  let grid='';for(let v=0;v<=ymax;v+=step)grid+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+3}" text-anchor="end">${inrShort(v)}</text>`;
  let bars='';byM.forEach((m,i)=>{const cx=pl+(W-pl-10)/6*(i+.5);let acc=0;STREAMS.forEach(([k])=>{const v=m[k]||0;if(!v)return;const y1=y(acc+v),y0=y(acc);bars+=`<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-1)}" fill="var(--c-${k})" rx="2"><title>${MONTHS[i].label} · ${k}: ${inr(v)}</title></rect>`;acc+=v});
    bars+=`<text x="${cx}" y="${y(tot[i])-6}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${inrShort(tot[i])}</text><text x="${cx}" y="${H-6}" text-anchor="middle">${MONTHS[i].label}${i===5?' *':''}</text>`});
  return `<div class="kpis">
    <div class="kpi"><span class="k">Revenue, ${MONTHS[5].label} so far</span><span class="v">${inr(thisM)}</span><span class="d muted">${nov.length} orders this month</span></div>
    <div class="kpi"><span class="k">Revenue, ${MONTHS[4].label}</span><span class="v">${inr(lastM)}</span><span class="d ${tot[4]>=tot[3]?'up':'down'}">${tot[3]?`${tot[4]>=tot[3]?'▲':'▼'} ${Math.abs(Math.round((tot[4]-tot[3])/tot[3]*100))}% vs ${MONTHS[3].label} · `:''}${oct.length} orders</span></div>
    <div class="kpi"><span class="k">Active students</span><span class="v">${active}</span><span class="d muted">${DB.students.filter(s=>s.status==='blocked').length} blocked · ${DB.students.filter(isExpired).length} expired</span></div>
    <div class="kpi"><span class="k">Render Reviews waiting</span><span class="v">${DB.reviews.filter(r=>r.status!=='delivered').length}</span><span class="d muted">${DB.subscribers} newsletter subscribers</span></div>
  </div>
  <div class="two">
    <div class="panel"><div class="panel-head"><h3>Revenue, last 6 months</h3><div class="legend">${STREAMS.map(([k,l])=>`<span><i style="background:var(--c-${k})"></i>${l}</span>`).join('')}</div></div><div class="panel-body"><div class="table-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto"><g class="grid">${grid}</g>${bars}</svg></div><p class="mono muted" style="margin-top:6px">* ${MONTHS[5].label} is month to date${DB.orders.length?'':' · Orders appear here once online payments are switched on'}</p></div></div>
    <div class="stack" style="gap:16px">
     <div class="panel"><div class="panel-head"><h3>Where the money comes from</h3><span class="mono muted">Last 6 months</span></div><div class="panel-body"><div class="split">${STREAMS.map(([k])=>`<span style="width:${allStream[k]/all*100}%;background:var(--c-${k})"></span>`).join('')}</div><div class="split-rows">${STREAMS.map(([k,l])=>`<div><i style="background:var(--c-${k})"></i><span>${l}</span><span class="num muted">${Math.round(allStream[k]/all*100)}%</span><b class="num">${inr(allStream[k])}</b></div>`).join('')}</div></div></div>

async function compressImage(file,maxW){
  if(file.size>15e6)throw new Error('That image is over 15 MB. Choose a smaller file.');
  const url=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That file isn’t an image we can read. Use JPG or PNG.'));i.src=url});
  const c=document.createElement('canvas');const sc=Math.min(1,maxW/img.width);c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.85));return{blob,preview:URL.createObjectURL(blob)};
}

const CHECKBOX_ACTS=['toggleLesson','toggleClip','toggleProduct','togglePerk'];
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;if(t.dataset.act==='closeScrim'){if(e.target===t)closeModal();return}if(t.type==='checkbox'&&!CHECKBOX_ACTS.includes(t.dataset.act)&&t.dataset.act!=='toggleCoupon')return;const f=ACT[t.dataset.act];if(!f)return;if(t.tagName==='A'&&t.dataset.act==='close'){closeModal();return}if(t.tagName!=='A'&&t.type!=='checkbox')e.preventDefault();f(t.dataset.arg,t,e)});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.matches('input[data-res-add]')&&t.files.length){const n=t.files.length;[...t.files].forEach(f=>S.editRes.push({id:'new-'+Math.random().toString(36).slice(2),name:f.name,size:f.size,note:'',file:f}));t.value='';drawResEditor();toast(`Added ${n} file${n>1?'s':''}. They upload when you press Save.`,2200);return}
  if(t.matches('select[data-act="rrStatus"]')){const id=t.dataset.arg,label=t.options[t.selectedIndex].text.toLowerCase();act(async()=>{await q(sb.from('render_reviews').update({status:t.value}).eq('id',id));await refresh()},`${id} marked ${label}`);return}
  if(t.matches('input[data-upload]')&&t.files[0]){const f=t.files[0];const kind=t.dataset.upload;
    try{const {blob,preview}=await compressImage(f,kind==='hero'?1920:kind==='cover'?1200:2000);
      if(kind==='hero'){act(async()=>{const url=await uploadTo('media',`hero/${t.dataset.mod}-${Date.now()}.jpg`,blob,'image/jpeg');await q(sb.from('modules').update({hero_image:url}).eq('id',t.dataset.mod));await refresh()},'Render added to the module card')}
      else if(kind==='cover'){S.coverBlob=blob;$('#cover-prev').innerHTML=`<img src="${preview}" alt="">`}
      else{S.reviewBlob=blob;t.closest('label').innerHTML=`<img src="${preview}" alt="" style="max-height:200px;margin:0 auto;border-radius:4px"><input id="${t.id}" type="file" accept="image/*" data-upload="review">`}
    }catch(err){toast(esc(errMsg(err)));t.value=''}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.resNote){const r=S.editRes.find(x=>x.id===t.dataset.resNote);if(r)r.note=t.value;return}
  if(t.matches('[data-ba]')){t.closest('.ba').style.setProperty('--pos',t.value+'%')}
  if(t.dataset.filter){S[t.dataset.filter]=t.value;const pos=t.selectionStart;route(true);const n=$('#'+t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
function setBusy(f,on,label){const b=f.querySelector('button.btn-primary,button:not([type=button])')||document.querySelector(`button[form="${f.id}"]`);const b2=f.id?document.querySelector(`button[form="${f.id}"]`):null;[b,b2].filter(Boolean).forEach(x=>{if(on){x.dataset.label=x.innerHTML;x.disabled=true;x.textContent=label||'Please wait…'}else{x.disabled=false;if(x.dataset.label)x.innerHTML=x.dataset.label}})}
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();if(S.busy)return;const fd=new FormData(f);
  const H={
    coupon:async()=>{const code=String(fd.get('code')||'').trim().toUpperCase();if(!code){S.cp=null;return checkout('')}const r=await q(sb.rpc('check_coupon',{c:code}));S.cp=(r&&r[0])||null;checkout(code)},
    pay:async()=>{modal('Online payment is coming soon',`<p>We’re setting up secure online payments (UPI, cards and netbanking). Until then, message Render Pro Academy on WhatsApp to buy, and you’ll get access the same day.</p>`,`<button class="btn btn-primary" data-act="close">OK</button>`)},
    newsletter:async()=>{const em=String(fd.get('email')||'').trim().toLowerCase();const {error}=await sb.from('subscribers').insert({email:em});if(error&&error.code!=='23505')throw error;f.reset();toast('You’re on the list. Thank you!')},
    review:async()=>{const st=curStudent();if(!perk('review')){S.reviewNotes={notes:fd.get('notes'),software:fd.get('software')+' · '+fd.get('type')};addToCart(S.reviewPkg==='video'?'rr-video':'rr-written',S.reviewNotes);return}
      if(!S.reviewBlob){toast('Choose your render image first.');return}
      const path=await uploadTo('files',`reviews/${MY.user.id}/${Date.now()}.jpg`,S.reviewBlob,'image/jpeg');
      await q(sb.from('render_reviews').insert({user_id:MY.user.id,name:st.name,email:st.email,phone:st.phone,pkg:S.reviewPkg,software:fd.get('software')+' · '+fd.get('type'),notes:fd.get('notes'),image_path:path,free:true,status:'pending'}));
      S.reviewBlob=null;f.reset();await refresh();modal('Render sent',`<p>Your render is with Render Pro Academy. Expect your ${S.reviewPkg==='video'?'video critique':'written notes'} by email at <b>${esc(st.email||'your email')}</b> within 3 working days.</p>`,`<button class="btn btn-primary" data-act="close">Done</button>`)},
    otpSend:async()=>{const em=(fd.get('email')||'').trim().toLowerCase();if(!validEmail(em)){S.loginErr='Enter a valid email address, for example you@gmail.com.';route(true);return}
      setBusy(f,true,'Sending code…');const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});setBusy(f,false);
      if(error){S.loginErr=errMsg(error);route(true);return}S.otpEmail=em;S.otp=true;S.loginErr='';route(true);toast(`We sent an ${OTP_LEN}-digit code to ${esc(em)}`)},
    otpVerify:async()=>{const token=String(fd.get('otp')||'').replace(/\D/g,'');setBusy(f,true,'Checking…');const {error}=await sb.auth.verifyOtp({email:S.otpEmail,token,type:'email'});
      if(error){setBusy(f,false);S.loginErr=/expired/i.test(error.message)?'This code has expired. Press “Resend code” for a new one.':`Check the ${OTP_LEN} digits and try again.`;route(true);return}
      S.otp=false;S.loginErr='';await loadAll();if(S.customer){toast(`Welcome back, ${esc(S.customer.name.split(' ')[0])}`);route(false);return}S.signup=true;route(true)},
    signup:async()=>{const name=String(fd.get('name')||'').trim();const ph=normPhone(fd.get('phone'));
      if(!ph){S.loginErr='Enter a 10-digit Indian mobile number, for example 98140 11223.';route(true);return}
      const {error}=await sb.from('customers').insert({user_id:MY.user.id,name,email:MY.user.email,phone:ph});
      if(error){S.loginErr=error.code==='23505'?'This mobile number is already linked to another email. Log in with that email, or use a different number.':errMsg(error);route(true);return}
      S.signup=false;S.loginErr='';await refresh(false);toast('Account created. You stay signed in on this device.')},
    studentLogin:async()=>{const id=String(fd.get('id')||'').trim().toUpperCase(),pw=String(fd.get('pw')||'');setBusy(f,true,'Logging in…');
      try{const r=await fetch(`${SUPABASE_URL}/functions/v1/student-login`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({loginId:id,password:pw,deviceId:deviceId(),deviceLabel:deviceLabel()})});
        const j=await r.json().catch(()=>({}));if(!r.ok){setBusy(f,false);S.loginErr=`<b>Can’t log in</b>${esc(j.message||'Try again.')}`;route(true);return}
        const {error}=await sb.auth.setSession(j.session);if(error)throw error;S.loginErr='';S.lesson=null;await refresh(false)}
      catch(err){setBusy(f,false);S.loginErr=`<b>Can’t log in</b>${esc(errMsg(err))}`;route(true)}},
    adminSend:async()=>{const em=(fd.get('email')||'').trim().toLowerCase();if(!validEmail(em)){S.loginErr='Enter a valid email address.';route(true);return}
      setBusy(f,true,'Sending code…');const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});setBusy(f,false);
      if(error){S.loginErr=errMsg(error);route(true);return}S.aEmail=em;S.aOtp=true;S.loginErr='';route(true)},
    adminVerify:async()=>{const token=String(fd.get('otp')||'').replace(/\D/g,'');setBusy(f,true,'Checking…');const {error}=await sb.auth.verifyOtp({email:S.aEmail,token,type:'email'});
      if(error){setBusy(f,false);S.loginErr=`Check the ${OTP_LEN} digits and try again.`;route(true);return}
      await loadAll();if(!S.admin){await sb.auth.signOut();await loadAll();S.loginErr='This email isn’t an admin of Render Pro Academy.';S.aOtp=false}else{S.aOtp=false;S.loginErr=''}route(true)},
    student:async()=>{const id=f.dataset.id;const exp=expiresFrom(fd);if(exp==='')return toast('Pick an end date, or choose Lifetime.');
      const loginId=String(fd.get('loginId')).trim().toUpperCase();const password=String(fd.get('password')).trim();
      const row={name:String(fd.get('name')).trim(),email:String(fd.get('email')).trim(),phone:normPhone(fd.get('phone'))||String(fd.get('phone')).trim(),tier:fd.get('tier'),expires:exp,status:fd.get('status'),perks:{lab:!!fd.get('perk_lab'),store:!!fd.get('perk_store'),review:!!fd.get('perk_review')}};
      setBusy(f,true,'Saving…');
      try{if(id){const old=studentById(id);await q(sb.from('students').update(row).eq('id',id));
          if(loginId!==old.loginId)await callFn('admin-api',{action:'changeLoginId',id,loginId});
          if(password&&password!==old.password)await callFn('admin-api',{action:'setPassword',id,password});
          closeModal();await refresh();toast('Saved')}
        else{const r=await callFn('admin-api',{action:'createStudent',student:{...row,loginId,password,source:'Manual'}});await refresh();showCreds(studentById(r.student.id))}}
      finally{setBusy(f,false)}},
    'coupon-new':async()=>{const code=String(fd.get('code')).trim().toUpperCase();if(!/^[A-Z0-9]{3,20}$/.test(code))return toast('Use 3–20 letters or numbers for the code.');
      await q(sb.from('coupons').insert({code,pct:+fd.get('pct'),applies:fd.get('applies'),max_uses:+fd.get('max')||0,active:true,note:fd.get('note')||''}));await refresh();toast(`Coupon ${code} created`)},
    settings:async()=>{const data={...DB.settings};delete data.heroImg;['priceFull','wasFull','priceAdv','wasAdv','priceUpgrade','bonusFull','bonusAdv','rrWritten','rrVideo'].forEach(k=>{if(fd.has(k))data[k]=+fd.get(k)});
      await q(sb.from('settings').update({data,updated_at:new Date().toISOString()}).eq('id',1));await refresh();toast('Prices saved')},
    lesson:async()=>{const id=f.dataset.id;const row={title:String(fd.get('title')).trim(),module_id:fd.get('module'),dur:fd.get('dur'),free_preview:!!fd.get('free')};
      setBusy(f,true,'Saving…');
      try{let lid=id;
        if(id)await q(sb.from('lessons').update(row).eq('id',id));
        else{const max=Math.max(0,...DB.lessons.filter(l=>l.module===row.module_id).map(l=>l.sort||0));const ins=await q(sb.from('lessons').insert({...row,sort:max+1,published:true}).select('id').single());lid=ins.id}
        const old=id?(DB.lessons.find(l=>l.id===id)?.resources||[]):[];const keep=new Set(S.editRes.map(r=>r.id));
        const gone=old.filter(r=>!keep.has(r.id));if(gone.length){await q(sb.from('lesson_resources').delete().in('id',gone.map(r=>r.id)));const p=gone.map(r=>r.path).filter(Boolean);if(p.length)await sb.storage.from('files').remove(p)}
        let i=0;for(const r of S.editRes){i++;
          if(r.file){const btn=document.querySelector('button[form="lform"]');if(btn)btn.textContent=`Uploading ${r.name}…`;const path=await uploadTo('files',`lessons/${lid}/${Date.now()}-${safeName(r.name)}`,r.file);await q(sb.from('lesson_resources').insert({lesson_id:lid,name:r.name,size:r.size,note:r.note||'',path,sort:i}))}
          else{const o=old.find(x=>x.id===r.id);if(o&&(o.note!==r.note))await q(sb.from('lesson_resources').update({note:r.note||'',sort:i}).eq('id',r.id))}}
        closeModal();await refresh();toast(id?'Lesson saved':'Lesson added')}finally{setBusy(f,false)}},
    clip:async()=>{const id=f.dataset.id;const row={title:String(fd.get('title')).trim(),tag:String(fd.get('tag')).trim(),software:String(fd.get('software')).trim(),price:+fd.get('price'),dur:fd.get('dur')};
      setBusy(f,true,'Saving…');
      try{let cid=id;if(!id){const ins=await q(sb.from('clips').insert({...row,seed:Math.floor(Math.random()*40),published:false,sort:DB.clips.length+1}).select('id').single());cid=ins.id}else await q(sb.from('clips').update(row).eq('id',id));
        if(S.coverBlob){const url=await uploadTo('media',`covers/${cid}-${Date.now()}.jpg`,S.coverBlob,'image/jpeg');await q(sb.from('clips').update({cover_url:url}).eq('id',cid));S.coverBlob=null}
        closeModal();await refresh();toast(id?'Video saved':'Video added. Switch on “Visible” when it’s ready.')}finally{setBusy(f,false)}},
    product:async()=>{const id=f.dataset.id;const type=fd.get('type');const row={name:String(fd.get('name')).trim(),type,cat:type==='bundle'?'Bundle':String(fd.get('cat')).trim(),price:+fd.get('price'),formats:fd.get('formats'),spec:fd.get('spec')};
      const zip=$('#pf-zip')?.files?.[0];setBusy(f,true,'Saving…');
      try{let pid=id;if(!id){const ins=await q(sb.from('products').insert({...row,seed:Math.floor(Math.random()*40),published:false,sort:DB.products.length+1}).select('id').single());pid=ins.id}else await q(sb.from('products').update(row).eq('id',id));
        if(S.coverBlob){const url=await uploadTo('media',`covers/${pid}-${Date.now()}.jpg`,S.coverBlob,'image/jpeg');await q(sb.from('products').update({cover_url:url}).eq('id',pid));S.coverBlob=null}
        if(zip){const btn=document.querySelector('button[form="pform"]');if(btn)btn.textContent=`Uploading ${zip.name}…`;const old=DB.products.find(p=>p.id===pid)?.file_path;const path=await uploadTo('files',`products/${pid}/${safeName(zip.name)}`,zip);await q(sb.from('products').update({file_path:path}).eq('id',pid));if(old&&old!==path)await sb.storage.from('files').remove([old])}
        closeModal();await refresh();toast(id?'Item saved':'Item added. Switch on “Visible” when it’s ready.')}finally{setBusy(f,false)}},
    galSubmit:async()=>{const st=curStudent();if(!S.reviewBlob)return toast('Choose your render image first.');setBusy(f,true,'Uploading…');
      try{const url=await uploadTo('media',`gallery/${MY.user.id}/${Date.now()}.jpg`,S.reviewBlob,'image/jpeg');await q(sb.from('gallery').insert({student_id:st.id,student_name:st.name,title:String(fd.get('title')).trim(),image_url:url,status:'pending',likes:0}));
        S.reviewBlob=null;closeModal();await refresh();toast('Sent. It appears in the gallery once approved.')}finally{setBusy(f,false)}},
    testimonial:async()=>{const st=curStudent();await q(sb.from('testimonials').insert({student_id:st.id,name:st.name,role:String(fd.get('role')||'Course student'),stars:+fd.get('stars'),text:String(fd.get('text')),status:'pending'}));closeModal();toast('Thank you! Your review appears after approval.')},
  };
  if(H[f.dataset.form]){try{await H[f.dataset.form]()}catch(err){console.error(err);toast(esc(errMsg(err)),5000)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML)closeModal()});

/* ---------- PWA ---------- */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installPrompt=e;renderHeader()});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

{const th=LS.get('rpa_theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;}
route();
refresh(false);
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.loaded&&!S.busy)refresh(true)});
</script>
